name: Publish npm

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # GoReleaser creates the tag before it uploads the archives, and postinstall downloads them.
      - name: Wait for release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=(--repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME")
          for _ in $(seq 1 40); do
            assets="$(gh release view "${release[@]}" --json assets --jq '.assets[].name' || true)"
            if grep -qx checksums.txt <<<"$assets"; then
              expected="$(gh release download "${release[@]}" --pattern checksums.txt --output - | awk '{print $2}')"
              missing="$(grep -vxF -f <(echo "$assets") <<<"$expected" || true)"
              [[ -z "$missing" ]] && exit 0
            fi
            sleep 15
          done
          echo "Release $GITHUB_REF_NAME is missing assets listed in checksums.txt after 10 minutes"
          exit 1

      - name: Build platform packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be a stable semantic version such as 1.2.3"
            exit 1
          fi

          (cd npm && npm version "$GITHUB_REF_NAME" --no-git-tag-version --allow-same-version)
          node scripts/build_npm.mjs

      # Platform packages first: the wrapper pins them at this exact version.
      - name: Publish
        run: bash scripts/publish_npm.sh
